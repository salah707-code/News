<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The Reporter</title>
    <meta name="description" content="The Reporter - تطبيق إخباري عصري وسريع بتصميم أندرويد تفاعلي" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta property="og:title" content="The Reporter" />
    <meta property="og:description" content="The Reporter - أخبار اللحظة برؤية ذكية" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#2563eb" />
    <script>
      try {
        var raw = localStorage.getItem('nabdh_news_settings_v3');
        var parsed = raw ? JSON.parse(raw) : null;
        var mode = parsed && parsed.darkMode ? parsed.darkMode : 'light';
        if (mode === 'dark' || mode === 'oled') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = mode === 'oled' ? '#060b18' : '#0a1128';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#f8fafc';
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#f8fafc] text-slate-900 font-sans antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
