name: The Reporter - Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build The Reporter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q News-Android-GitHub-Actions.zip -d android-project

          test -f android-project/News-main/capacitor.config.ts
          test -f android-project/News-main/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        working-directory: android-project/News-main
        run: npm install

      - name: Install fixed Capacitor version
        working-directory: android-project/News-main
        run: |
          npm install --save-exact \
            @capacitor/core@8.5.0 \
            @capacitor/android@8.5.0

          npm install --save-dev \
            @capacitor/cli@8.5.0

      - name: Verify toolchain
        working-directory: android-project/News-main
        run: |
          echo "Node:"
          node --version

          echo "Java:"
          java -version

          echo "Capacitor:"
          npx cap --version

          echo "Config:"
          cat capacitor.config.ts

      - name: Build web application
        working-directory: android-project/News-main
        run: npx vite build

      - name: Verify web build
        working-directory: android-project/News-main
        run: |
          test -f dist/index.html
          echo "Web build OK."

      - name: Add Android platform
        working-directory: android-project/News-main
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: android-project/News-main
        run: npx cap sync android

      - name: Verify Android configuration
        working-directory: android-project/News-main
        run: |
          test -f android/gradlew
          test -f android/settings.gradle

          echo "Android project created successfully."

      - name: Make Gradle executable
        working-directory: android-project/News-main
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android-project/News-main/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        working-directory: android-project/News-main
        run: |
          echo "=== APK ==="
          find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Reporter-Debug-APK
          path: android-project/News-main/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
