
name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Android Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "=== Repository ==="
          find . -maxdepth 3 -type f | sort

      - name: Extract Android ZIP
        run: |
          mkdir -p android-project
          unzip -q News-Android-GitHub-Actions.zip -d android-project

      - name: Inspect Android project
        run: |
          echo "=== Extracted files ==="
          find android-project -maxdepth 5 -type f | sort

          echo ""
          echo "=== Gradle wrappers ==="
          find android-project -type f -name gradlew -print

          echo ""
          echo "=== Gradle settings ==="
          find android-project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print
